<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MeditateNow - Find your calm. A premium wellness product built with Flutter, Material 3, and Dart.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MeditateNow">
  <title>MeditateNow - Find your calm</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="background-color: #FAF8F5; margin: 0; padding: 0;">
  <script src="flutter_bootstrap.js" async></script>
  <script src="flutter.js" defer></script>
  <script>
    window.addEventListener('load', function(ev) {
      if (window._flutter && window._flutter.loader) {
        _flutter.loader.loadEntrypoint({
          onEntrypointLoaded: function(engineInitializer) {
            engineInitializer.initializeEngine().then(function(appRunner) {
              appRunner.runApp();
            });
          }
        });
      }
    });
  </script>
</body>
</html>
